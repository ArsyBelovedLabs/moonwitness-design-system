name: Design System CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@arsybelovedlabs'
      - name: Verify canonical frontend package access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(npm view @arsybelovedlabs/moonwitness-frontend-platform@0.3.5 version --registry=https://npm.pkg.github.com)" = "0.3.5"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build-storybook
